name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          GENTLE_PI_REQUIRE_NATIVE_BINARY: "1"

      - name: Type check
        run: pnpm run typecheck

      - name: Verify generated runtime modules
        run: pnpm run check:runtime-modules

      - name: Verify package contents
        run: node scripts/verify-package-files.mjs

      - name: Verify packed installation
        run: pnpm run test:packed-package

  session-transport-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GENTLE_PI_SKIP_GENTLE_AI_INSTALL: "1"

      - name: Run Darwin session transport tests
        run: pnpm exec node --experimental-strip-types --test tests/agents-session-transport.test.ts tests/agents-session-transport-process.test.ts tests/gentle-agents.test.ts

      - name: Verify generated runtime modules
        run: pnpm run check:runtime-modules

  review-routing-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install dependencies without lifecycle scripts
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$env:RUNNER_TEMP\pnpm-store"

      - name: Run Windows review routing regressions
        shell: pwsh
        timeout-minutes: 12
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'review-routing-windows.tap.log'
          $previousErrorActionPreference = $ErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          & node --experimental-strip-types --test --test-reporter=tap tests/review-controller-native-routing.test.ts tests/gentle-ai.test.ts 2>&1 | Tee-Object -LiteralPath $log
          $status = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference
          if ($status -ne 0) { exit $status }
          $tap = Get-Content -LiteralPath $log -Raw -ErrorAction Stop
          $passes = [regex]::Matches($tap, '(?m)^# pass (\d+)\r?$')
          if ($passes.Count -eq 0 -or [long]$passes[$passes.Count - 1].Groups[1].Value -le 0) {
            throw 'Windows review routing regressions executed no passing tests'
          }

      - name: Upload Windows review routing log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-routing-windows-log
          path: ${{ runner.temp }}/review-routing-windows.tap.log
          retention-days: 7
          if-no-files-found: warn

  review-repository-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GENTLE_PI_SKIP_GENTLE_AI_INSTALL: "1"

      - name: Run Windows Git authority probe
        shell: pwsh
        run: pnpm exec node --experimental-strip-types --test tests/review-repository.test.ts

      - name: Run Windows candidate view regression
        shell: pwsh
        run: |
          $output = & pnpm exec node --experimental-strip-types --test --test-reporter=tap --test-name-pattern "candidate owner|candidate contributor root|candidate executable-mode validation|candidate registry forwards explicit Windows mode validation" tests/review-candidate-view.test.ts 2>&1
          $status = $LASTEXITCODE
          $output | Write-Output
          if ($status -ne 0) { exit $status }
          $passes = [regex]::Match(($output -join "`n"), "(?m)^# pass (\d+)$")
          if ($output -match "(?m)^1\.\.0$" -or !$passes.Success -or [int]$passes.Groups[1].Value -eq 0) { throw "Windows candidate view regression selected no tests" }

      - name: Run Windows native consent boundary
        shell: pwsh
        run: pnpm exec node --experimental-strip-types --test tests/native-review-consent.test.ts
