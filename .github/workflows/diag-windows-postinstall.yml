name: diag-windows-postinstall
on:
  push:
    branches: [diag/windows-postinstall]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache: false
      - name: Long paths off
        shell: pwsh
        run: |
          Set-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0
          "LongPathsEnabled: $((Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem).LongPathsEnabled)"
      - name: Main installer from a short path
        shell: pwsh
        run: |
          $dst = "C:\g"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          git archive HEAD | & "$env:SystemRoot\System32\tar.exe" -x -C $dst
          node diag/run-installer.mjs $dst
      - name: Main installer at the release store depth (161)
        shell: pwsh
        run: |
          $dst = Join-Path $env:LOCALAPPDATA ("pnpm\store\v11\links\@\gentle-pi\4.0.0\" + ("e" * 64) + "\node_modules\gentle-pi")
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          git archive HEAD | & "$env:SystemRoot\System32\tar.exe" -x -C $dst
          node diag/run-installer.mjs $dst
      - name: Main installer at the main store depth (179)
        shell: pwsh
        run: |
          $dst = Join-Path $env:LOCALAPPDATA ("pnpm\store\v11\links\@\gentle-pi\4.0.0-main.95c618a49a8f\" + ("f" * 64) + "\node_modules\gentle-pi")
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          git archive HEAD | & "$env:SystemRoot\System32\tar.exe" -x -C $dst
          node diag/run-installer.mjs $dst
