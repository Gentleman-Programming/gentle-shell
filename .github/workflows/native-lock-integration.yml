name: Native lock application integration
on:
  push:
    branches: [ci/4946-native-lock-integration]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.14.0']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Isolate configuration and caches
        id: init
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/native-integration.XXXXXX")
          mkdir -p "$root/home" "$root/tmp" "$root/config" "$root/cache" "$root/agent" "$root/models"
          for entry in "HOME=home" "USERPROFILE=home" "TMPDIR=tmp" "TMP=tmp" "TEMP=tmp" "XDG_CONFIG_HOME=config" "XDG_CACHE_HOME=cache" "npm_config_cache=cache/npm" "PNPM_HOME=cache/pnpm" "GENTLE_PI_AGENT_HOME=agent" "PI_CODING_AGENT_DIR=agent" "GENTLE_PI_CONFIG_HOME=models"; do
            echo "${entry%%=*}=$root/${entry#*=}" >> "$GITHUB_ENV"
          done
          echo 'npm_config_ignore_scripts=true' >> "$GITHUB_ENV"
          echo 'GENTLE_PI_REQUIRE_NATIVE_BINARY=1' >> "$GITHUB_ENV"
          echo "CI_PROOF_ROOT=$root" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.1.1
          run_install: false
      - name: Frozen graph without lifecycle scripts
        id: install
        run: timeout --verbose 300s pnpm install --frozen-lockfile --ignore-scripts --store-dir "$CI_PROOF_ROOT/cache/store"
      - name: Explicit integrity-pinned native application installer
        id: native
        run: timeout --verbose 180s node scripts/install-gentle-ai.mjs
      - name: Full suite (all stages and final summary)
        id: suite
        continue-on-error: true
        run: timeout --verbose 900s pnpm test
      - name: Focused recovery and preservation
        id: focused
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        continue-on-error: true
        run: timeout --verbose 180s node --experimental-strip-types --test tests/model-profiles-lock-recovery.test.ts tests/model-profiles-preservation.test.ts
      - name: Type ratchet
        id: types
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        continue-on-error: true
        run: timeout --verbose 120s pnpm run typecheck
      - name: Runtime consistency
        id: runtime
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        continue-on-error: true
        run: timeout --verbose 120s pnpm run check:runtime-modules
      - name: Package contents
        id: contents
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        continue-on-error: true
        run: timeout --verbose 120s node scripts/verify-package-files.mjs
      - name: Packed public SDK application proof
        id: packed
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        continue-on-error: true
        run: timeout --verbose 300s node .github/native-lock-integration/packed-probe.mjs
      - name: Required outcome gate
        if: ${{ always() }}
        env:
          OUTCOMES: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const steps = JSON.parse(process.env.OUTCOMES);
          const required = ['init', 'install', 'native', 'suite', 'focused', 'types', 'runtime', 'contents', 'packed'];
          const rows = required.map(id => `${id}: ${steps[id]?.outcome ?? 'missing'}`);
          console.log(rows.join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Native application integration\n\n' + rows.join('\n\n') + '\n\nTimeouts/skips/missing outcomes are failures. Automated public SDK proof is not interactive Pi proof.\n');
          if (required.some(id => steps[id]?.outcome !== 'success')) process.exitCode = 1;
          NODE
