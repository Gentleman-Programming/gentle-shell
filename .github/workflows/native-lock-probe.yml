name: Native lock Linux probe
on:
  push:
    branches:
      - ci/4946-native-lock-probe
permissions:
  contents: read
jobs:
  linux-native-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.14.0"]
    steps:
      - name: Checkout exact probe commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned binding without lifecycle scripts
        working-directory: .github/native-lock-probe
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify descriptor exclusion, process exclusion and crash release
        working-directory: .github/native-lock-probe
        run: node probe.mjs
