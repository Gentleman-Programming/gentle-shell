<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<title>Gentle Design</title>
	<link rel="stylesheet" href="{{BASE}}assets/canvas.css">
	<script id="gd-config" type="application/json">{{CONFIG}}</script>
	<script src="{{BASE}}assets/canvas.js" defer></script>
</head>
<body>
	<header class="gd-bar" role="toolbar" aria-label="Design canvas controls">
		<h1 class="gd-title" id="gd-title">Gentle Design</h1>
		<label class="gd-field" id="gd-design-field">
			<span class="gd-visually-hidden">Design</span>
			<select id="gd-design" aria-label="Design"></select>
		</label>
		<p id="gd-feature" class="gd-feature" hidden></p>
		<div class="gd-group" role="group" aria-label="Zoom">
			<button type="button" id="gd-zoom-out" aria-label="Zoom out">&minus;</button>
			<output id="gd-zoom-level" aria-live="polite" aria-label="Zoom level">100%</output>
			<button type="button" id="gd-zoom-in" aria-label="Zoom in">+</button>
			<button type="button" id="gd-fit">Fit</button>
		</div>
		<p id="gd-nav-mode" class="gd-nav-mode" role="status" aria-live="polite">Navigating</p>
		<button type="button" id="gd-comment" class="gd-toggle" aria-pressed="false">Comment</button>
		<div class="gd-group" role="radiogroup" aria-label="When a comment is sent to the session">
			<label class="gd-radio"><input type="radio" name="gd-send-mode" id="gd-mode-send" value="send"> Send now</label>
			<label class="gd-radio"><input type="radio" name="gd-send-mode" id="gd-mode-collect" value="collect"> Collect</label>
		</div>
		<button type="button" id="gd-send-all" disabled>Send all (0)</button>
		<button type="button" id="gd-panel-toggle" class="gd-toggle" aria-pressed="true" aria-controls="gd-panel">Comments</button>
		<p id="gd-status" class="gd-status" role="status" aria-live="polite"></p>
	</header>
	<div class="gd-main">
		<main id="gd-viewport" class="gd-viewport" aria-label="Artboards" tabindex="0">
			<div id="gd-world" class="gd-world"></div>
			<p id="gd-empty" class="gd-empty" hidden></p>
			<button type="button" id="gd-back" class="gd-back" aria-keyshortcuts="Shift+Escape" title="Back to canvas (Shift+Esc)" hidden>Back to canvas</button>
		</main>
		<aside id="gd-panel" class="gd-panel" aria-labelledby="gd-panel-title">
			<h2 id="gd-panel-title" class="gd-panel-title">Comments</h2>
			<div class="gd-group gd-filter" role="group" aria-label="Show comments">
				<button type="button" id="gd-filter-open" aria-pressed="true">Open (0)</button>
				<button type="button" id="gd-filter-resolved" aria-pressed="false">Resolved (0)</button>
			</div>
			<p id="gd-panel-empty" class="gd-panel-empty">No comments yet. Turn on Comment mode and click an element.</p>
			<ol id="gd-comment-list" class="gd-comment-list" aria-label="Comments"></ol>
		</aside>
		<section id="gd-compare" class="gd-compare" aria-labelledby="gd-compare-title" hidden>
			<div class="gd-compare-bar">
				<h2 id="gd-compare-title" class="gd-compare-title">Compare</h2>
				<label class="gd-radio" id="gd-compare-fit-field" hidden><input type="checkbox" id="gd-compare-fit"> Scale to fit</label>
				<a id="gd-compare-open" class="gd-compare-open" target="_blank" rel="noopener noreferrer">Open in new tab</a>
				<button type="button" id="gd-compare-back" class="gd-primary" aria-keyshortcuts="Shift+Escape" title="Back to canvas (Shift+Esc)">Back to canvas</button>
			</div>
			<p id="gd-compare-message" class="gd-compare-message" role="status" aria-live="polite"></p>
			<div id="gd-compare-stage" class="gd-compare-stage">
				<div id="gd-compare-sizer" class="gd-compare-sizer">
					<div id="gd-compare-panes" class="gd-compare-panes"></div>
				</div>
			</div>
		</section>
	</div>
	<div id="gd-toast" class="gd-toast" role="status" aria-live="polite" hidden></div>
	<div id="gd-popover" class="gd-popover" role="dialog" aria-modal="false" aria-labelledby="gd-popover-title" hidden>
		<form id="gd-popover-form">
			<p class="gd-popover-title" id="gd-popover-title">Comment on <code id="gd-popover-target"></code></p>
			<label class="gd-visually-hidden" for="gd-popover-text">Comment</label>
			<textarea id="gd-popover-text" rows="4" maxlength="2000" required placeholder="What should change?"></textarea>
			<div class="gd-shot">
				<input type="file" id="gd-shot-input" accept="image/png,image/jpeg,image/webp,image/gif" tabindex="-1" aria-hidden="true" hidden>
				<button type="button" id="gd-shot-attach" title="Or paste an image, or drop one here (PNG, JPEG, WebP or GIF, up to 5 MB)">Attach screenshot</button>
				<figure id="gd-shot-preview" class="gd-shot-preview" hidden>
					<img id="gd-shot-image" alt="Attached screenshot">
					<button type="button" id="gd-shot-remove">Remove</button>
				</figure>
			</div>
			<div class="gd-popover-actions">
				<span id="gd-popover-message" class="gd-popover-message" role="status" aria-live="polite"></span>
				<button type="button" id="gd-popover-cancel">Cancel</button>
				<button type="submit" id="gd-popover-send" class="gd-primary">Send</button>
			</div>
		</form>
	</div>
</body>
</html>
