<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Shell — The club is the harness</title>
<style>
:root{
  --text:#f6eff3;--text-muted:#a78e9b;--text-faint:#76616b;
  --accent:#f095c8;--accent-strong:#ff76c3;--accent-soft:#ffb1dd;--success:#b4e7c7;--warning:#e0c27a;--info:#a9c7ee;
  --brand-violet:#9146ff;--teal:#5ee6e6;
  --font-mono:"IosevkaTerm NF","Iosevka Term","JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --font-sans:Inter,"SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:#0c0714;color:var(--text);font:14px/1.5 var(--font-mono);height:100vh;overflow:hidden;display:grid;place-items:center}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative}
canvas{display:block;image-rendering:pixelated}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,#00000018 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 62%,#00000080 100%)}
.px{background:#0c0714e8;border:2px solid #4a2a5e;box-shadow:inset 0 0 0 2px #0c0714,0 0 0 2px #00000080}
.plan{position:absolute;top:14px;left:14px;padding:7px 11px;display:grid;gap:4px;z-index:2}
.lab{font-size:11.5px;color:var(--text-muted);letter-spacing:.12em}
.pips{display:flex;gap:3px}.pips i{width:11px;height:15px;background:#2a1640;border:1px solid #4a2a5e}
.pips i.on{background:var(--teal);border-color:#9ff5f5;box-shadow:0 0 6px #5ee6e680}
.val{font-size:12.5px}
.legend{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:2}
.legend button{display:flex;align-items:center;gap:6px;padding:3px 9px;font-size:12.5px;color:var(--text-muted)}
.legend button[aria-pressed="true"]{color:var(--text);background:#ffffff0d}
.legend i{width:9px;height:9px;display:inline-block}
.pause{position:absolute;top:14px;right:14px;padding:7px 13px;font-weight:700;letter-spacing:.12em;z-index:2}
.pause[aria-pressed="true"]{color:var(--warning);border-color:var(--warning)}
.crew{position:absolute;left:14px;top:100px;display:grid;gap:5px;z-index:2}
.mate{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:8px;padding:4px 10px 4px 6px;font-size:12px;color:var(--text-muted);width:210px;text-align:left}
.mate small{grid-column:2;color:var(--text-faint);font-size:11px;margin-top:-3px}
.mate:hover,.mate[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
.mate .sw{width:12px;height:16px;border:1px solid #000;grid-row:span 2}
.mate .st{font-weight:800;grid-row:span 2}
.st.need{color:var(--warning)}.st.done{color:var(--success)}.st.work{color:var(--teal)}
.tip{position:absolute;pointer-events:none;padding:4px 8px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-135%);z-index:3;display:none}
.sel{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:16px;padding:10px 14px;z-index:2;max-width:calc(100% - 28px)}
.sel.open{display:flex}.sel .nm{font-weight:700}.sel .meta{color:var(--text-muted);font-size:12.5px}
.btn{padding:5px 12px;border:2px solid #4a2a5e;background:#1a0f26;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-soft)}
.btn.primary{background:var(--accent);color:#1a0f26;border-color:var(--accent-soft)}
.event{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 48px));padding:18px 20px;z-index:4;display:none}
.event.open{display:block}
.event .from{color:var(--warning);font-weight:700;font-size:13px;letter-spacing:.08em}
.event p{margin:10px 0 12px;font-size:15px;line-height:1.6}
.event ol{list-style:none;display:grid;gap:2px}
.event ol button{width:100%;text-align:left;padding:4px 6px;color:var(--teal);font-size:14.5px}
.event ol button:hover,.event ol button:focus-visible{color:var(--accent-strong);background:#ffffff08;outline:none}
.event .n{color:var(--text-faint);margin-right:8px}.event .rec{color:var(--text-muted);font-size:12px;margin-left:8px}
.event .ans{margin-top:10px;padding-top:10px;border-top:1px dashed #4a2a5e;color:var(--accent-soft);display:none}.event .ans.show{display:block}
.dim{position:absolute;inset:0;background:#0c071480;z-index:3;display:none}.dim.open{display:block}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" width="384" height="216" aria-label="The Gentleman Club in cutaway. Each room is a part of Gentle Shell; each agent stands in the room of what it is doing."></canvas>
  <div class="plan px" aria-label="Plan: 64% left this week"><span class="lab">PLAN</span><span class="pips" id="plan"></span><span class="val">64% left · resets Monday</span></div>
  <div class="legend px" role="group" aria-label="Projects (shirt colour)" id="legend"></div>
  <button class="pause px" id="pause" aria-pressed="false" title="Pause every agent (Space)">❚❚ PAUSE ALL</button>
  <nav class="crew" id="crew" aria-label="Your agents"></nav>
  <div class="tip px" id="tip"></div>
  <div class="sel px" id="sel" aria-live="polite"></div>
  <div class="dim" id="dim"></div>
  <section class="event px" id="event" role="dialog" aria-modal="true" aria-labelledby="ev-from"><div class="from" id="ev-from"></div><p id="ev-text"></p><ol id="ev-ch"></ol><div class="ans" id="ev-ans" aria-live="polite"></div></section>
</div>
<script>
const W=384,H=216,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={neon:'#ff76c3',acc:'#f095c8',accS:'#ffb1dd',ok:'#b4e7c7',warn:'#e0c27a',info:'#a9c7ee',vio:'#9146ff',teal:'#5ee6e6',red:'#ff718f',
  ink:'#0c0714',hull:'#1a0f26',hull2:'#2a1640',edge:'#4a2a5e',metal:'#6a5a7e',skin:'#e8b89a',skinD:'#c8957a',hair:'#2a1b27'};
const BY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16));
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const rnd=s=>{const v=Math.sin(s*12.9898)*43758.5453;return v-Math.floor(v)};
const px=(g,x,y,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,1,1)},rect=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
function dgrad(g,x0,y0,x1,y1,pal){for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0)*(pal.length-1),i=Math.min(pal.length-2,t|0),f=t-i;for(let x=x0;x<x1;x++)px(g,x,y,f>BY[y&3][x&3]?pal[i+1]:pal[i])}}
// shaded box: light top-left edges, dark bottom-right edges
function box(g,x,y,w,h,c){rect(g,x,y,w,h,c);rect(g,x,y,w,1,mix(c,'#ffffff',.22));rect(g,x,y,1,h,mix(c,'#ffffff',.1));rect(g,x,y+h-1,w,1,mix(c,'#000000',.35));rect(g,x+w-1,y,1,h,mix(c,'#000000',.25))}
function glow(g,cx,cy,rx,ry,c,s=1){g.save();g.globalAlpha=.5;for(let y=cy-ry;y<cy+ry;y++)for(let x=cx-rx;x<cx+rx;x++){const d=Math.hypot((x-cx)/rx,(y-cy)/ry);if(d<1&&(1-d)*(1-d)*s>BY[(y|0)&3][(x|0)&3])px(g,x,y,c)}g.restore()}
// sprites drawn once, with an automatic 1px dark outline
function sprite(w,h,fn,outline=C.ink){const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');g.translate(1,1);fn(g);
  const d=g.getImageData(0,0,w+2,h+2),a=(x,y)=>x>=0&&y>=0&&x<w+2&&y<h+2&&d.data[(y*(w+2)+x)*4+3]>0,out=[];
  for(let y=0;y<h+2;y++)for(let x=0;x<w+2;x++)if(!a(x,y)&&(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)))out.push([x,y]);
  g.setTransform(1,0,0,1,0,0);g.fillStyle=outline;out.forEach(([x,y])=>g.fillRect(x,y,1,1));return c}
const F={A:['010','101','111','101','101'],B:['110','101','110','101','110'],E:['111','100','110','100','111'],G:['011','100','101','101','011'],H:['101','101','111','101','101'],I:['111','010','010','010','111'],
  K:['101','110','100','110','101'],L:['100','100','100','100','111'],M:['10001','11011','10101','10001','10001'],N:['1001','1101','1011','1001','1001'],O:['010','101','101','101','010'],P:['110','101','110','100','100'],
  R:['110','101','110','101','101'],S:['011','100','010','001','110'],T:['111','010','010','010','010'],U:['101','101','101','101','111'],V:['101','101','101','101','010'],W:['10001','10001','10101','11011','10001'],' ':['00','00','00','00','00'],'0':['111','101','101','101','111'],'1':['010','110','010','010','111'],'2':['111','001','111','100','111'],'3':['111','001','111','001','111'],'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],'6':['111','100','111','101','111'],'7':['111','001','001','001','001'],'8':['111','101','111','101','111'],'9':['111','101','111','001','111'],'$':['011','110','010','011','110'],'.':['0','0','0','0','1'],'k':['100','101','110','101','101']};
function plain(g,s,x,y,c){let cx=x;for(const ch of s){const f=F[ch];f.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='1')rect(g,cx+i,y+j,1,1,c)}));cx+=f[0].length+1}}
function word(g,s,x,y,c,lit=1){let cx=x;g.save();for(const ch of s){const f=F[ch];f.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='1'){if(lit){g.globalAlpha=.25;rect(g,cx+i-1,y+j-1,3,3,c);g.globalAlpha=1}rect(g,cx+i,y+j,1,1,lit?c:mix(c,'#000',.55))}}));cx+=f[0].length+1}g.restore();return cx}
const MUST=['..#.........#..','.#.##.....##.#.','.#..#######..#.','..##.......##..'];

// ---------- layout ----------
const HULL={x:22,y:34,w:340,h:164};
const F1={y:42,h:72},F2={y:120,h:72};
const rooms=[
  {id:'map',sign:'MAP',x:26,y:F1.y,w:78,h:F1.h,col:C.teal,tint:'#132036',role:'Explorer',tier:1,what:'Exploring and planning'},
  {id:'workshop',sign:'WORKSHOP',x:108,y:F1.y,w:104,h:F1.h,col:C.neon,tint:'#2a1530',role:'Builder',tier:3,what:'Building'},
  {id:'lab',sign:'LAB',x:216,y:F1.y,w:68,h:F1.h,col:C.ok,tint:'#13281f',role:'Verifier',tier:2,what:'Checking with tests'},
  {id:'review',sign:'REVIEW',x:288,y:F1.y,w:70,h:F1.h,col:C.warn,tint:'#221a14',role:'Reviewers',tier:3,what:'Review',dim:1},
  {id:'engine',sign:'GENTLE AI',x:26,y:F2.y,w:112,h:F2.h,col:C.neon,tint:'#24112a',what:'Engine room'},
  {id:'library',sign:'ENGRAM',x:142,y:F2.y,w:118,h:F2.h,col:C.vio,tint:'#1a1438',what:'Memory'},
  {id:'lounge',sign:'LOUNGE',x:264,y:F2.y,w:94,h:F2.h,col:C.accS,tint:'#2a1626',what:'Lounge'},
];
const R=id=>rooms.find(r=>r.id===id);
const TIER=['','fast · Haiku 5.5','balanced · Sonnet 5.5','strongest · Opus 5.5'];
const PROJ={'gentle-ai':C.acc,'engram':C.vio,'gentle-pi':C.teal,'landing':C.warn};

// ---------- static scene ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const g=bg.getContext('2d');
// sky, stars, striped sun, neon grid
dgrad(g,0,0,W,H,['#0a0612','#170c30','#2e1158','#5a1872','#8e2480','#c83a7e','#f2708e']);
for(let i=0;i<90;i++){const x=rnd(i)*W|0,y=rnd(i+40)*110|0;px(g,x,y,rnd(i+7)>.75?C.teal:'#ffffffa0')}
for(let y=150;y<205;y++)for(let x=330;x<384;x++){const d=Math.hypot(x-366,y-188);if(d>30)continue;if(y>172&&(y%4)<Math.min(3,(y-172)/5))continue;px(g,x,y,y<166?'#ffe08a':y<180?'#ff9e8a':'#ff6fa8')}
g.save();g.globalAlpha=.55;for(let i=0;i<5;i++)rect(g,0,200+i*i*.9,W,1,i%2?C.teal:C.neon);for(let i=-14;i<=14;i++)for(let y=200;y<H;y++){const k=(y-200)/16;px(g,192+i*15+i*15*k*2.4,y,C.teal)}g.restore();
// hull shell with rivets and a neon trim
box(g,HULL.x-4,HULL.y-4,HULL.w+8,HULL.h+8,'#24163a');rect(g,HULL.x,HULL.y,HULL.w,HULL.h,C.ink);
for(let x=HULL.x;x<HULL.x+HULL.w;x+=8){px(g,x,HULL.y-2,C.metal);px(g,x,HULL.y+HULL.h+1,C.metal)}
g.save();g.globalAlpha=.35;rect(g,HULL.x-5,HULL.y-5,HULL.w+10,1,C.neon);rect(g,HULL.x-5,HULL.y+HULL.h+4,HULL.w+10,1,C.neon);g.restore();
// roof: the mustache sign and an antenna
box(g,160,18,64,14,'#24163a');rect(g,162,20,60,10,C.ink);
g.save();g.globalAlpha=.3;MUST.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='#')rect(g,169+i*2-1,21+j*2-1,4,4,C.neon)}));g.restore();
MUST.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='#')rect(g,169+i*2,21+j*2,2,2,C.neon)}));
rect(g,300,12,1,22,C.metal);px(g,300,11,C.red);glow(g,300,11,5,5,C.red,.9);
// rooms: back wall with panels, floor, ceiling light
for(const r of rooms){
  dgrad(g,r.x,r.y,r.x+r.w,r.y+r.h-6,[mix(r.tint,'#000',.45),r.tint,mix(r.tint,'#000',.15)]);
  for(let x=r.x+12;x<r.x+r.w;x+=14)rect(g,x,r.y+8,1,r.h-14,mix(r.tint,'#000',.35));
  rect(g,r.x,r.y+r.h-26,r.w,1,mix(r.tint,'#fff',.08));
  box(g,r.x,r.y+r.h-6,r.w,6,mix(r.tint,'#3a2a4a',.6));for(let x=r.x+3;x<r.x+r.w;x+=6)rect(g,x,r.y+r.h-5,1,4,mix(r.tint,'#000',.4));
  rect(g,r.x,r.y,r.w,3,'#24163a');
  if(!r.dim){rect(g,r.x+r.w/2-5,r.y+3,10,1,'#fff6e0');glow(g,r.x+r.w/2,r.y+16,r.w*.45,22,mix(r.col,'#fff',.5),.55)}
  word(g,r.sign,r.x+5,r.y+7,r.col,!r.dim);
}
// walls between rooms with doors, the floor slab, conduits from the engine room
for(const x of [104,212,284])rect(g,x,F1.y,4,F1.h,'#24163a');for(const x of [138,260])rect(g,x,F2.y,4,F2.h,'#24163a');
box(g,HULL.x,F1.y+F1.h,HULL.w,6,'#24163a');
for(const [x,y] of [[104,F1.y+F1.h-26],[212,F1.y+F1.h-26],[284,F1.y+F1.h-26],[138,F2.y+F2.h-26],[260,F2.y+F2.h-26]]){rect(g,x,y,4,20,mix(C.ink,'#24163a',.4));rect(g,x+1,y,2,1,C.metal)}
const pipe=(x0,y0,x1,y1)=>{for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){px(g,x,y0,'#4a3a5e');px(g,x,y0+1,'#2a2040')}for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++){px(g,x1,y,'#4a3a5e');px(g,x1+1,y,'#2a2040')}};
pipe(70,F2.y+1,70,F1.y+F1.h+2);pipe(70,F1.y+F1.h+3,350,F1.y+F1.h+3);
for(let x=78;x<350;x+=22){rect(g,x,F1.y+F1.h+2,2,4,C.neon);glow(g,x+1,F1.y+F1.h+4,4,3,C.neon,.7)}

// MAP: corkboard with notes and string, drafting table with a blueprint
box(g,32,58,44,30,'#7a5236');for(let y=59;y<87;y++)for(let x=33;x<75;x++)if(rnd(x*y)>.7)px(g,x,y,'#8e6444');
[[36,62,C.accS],[50,60,'#f6eff3'],[62,64,C.teal],[40,74,'#f6eff3'],[56,76,C.warn],[66,74,'#f6eff3']].forEach(([x,y,c])=>{box(g,x,y,7,6,c);px(g,x+3,y,C.red)});
g.save();g.strokeStyle=C.red;g.globalAlpha=.8;g.lineWidth=1;g.beginPath();[[40,62],[53,60],[65,64],[59,76],[43,74],[40,62]].forEach(([x,y],i)=>i?g.lineTo(x+.5,y+.5):g.moveTo(x+.5,y+.5));g.stroke();g.restore();
box(g,78,96,22,3,'#4a3a5e');rect(g,80,99,2,9,'#2a2040');rect(g,96,99,2,9,'#2a2040');box(g,79,91,20,5,'#3a6ab0');for(let i=0;i<4;i++)rect(g,81+i*4,92,2,1,'#a9c7ee');
rect(g,94,78,1,13,C.metal);rect(g,92,77,5,2,C.metal);glow(g,94,86,10,8,'#fff6e0',.6);
// WORKSHOP: pegboard with tools, two benches with screens, crates
box(g,114,56,40,24,'#3a2a3e');for(let y=58;y<78;y+=3)for(let x=116;x<152;x+=3)px(g,x,y,'#24182a');
rect(g,118,60,2,12,C.metal);rect(g,116,60,6,3,C.metal);rect(g,126,60,2,14,'#8e6444');rect(g,124,60,6,4,C.metal);rect(g,134,62,8,2,C.metal);rect(g,136,64,2,8,C.metal);rect(g,146,60,2,13,C.warn);
const bench=(x,w)=>{box(g,x,96,w,4,'#5a3a4a');rect(g,x+2,100,2,8,'#2a2040');rect(g,x+w-4,100,2,8,'#2a2040')};
bench(118,30);bench(160,34);
box(g,124,82,16,13,'#2a2040');rect(g,126,84,12,9,'#000');box(g,168,82,16,13,'#2a2040');rect(g,170,84,12,9,'#000');
box(g,196,100,12,8,'#6a4a36');rect(g,196,103,12,1,'#4a3226');
// LAB: test tubes, beakers, the red-amber-green tower
bench(220,40);for(let i=0;i<6;i++){const x=224+i*5,c=i<2?C.red:C.ok;rect(g,x,88,3,8,'#cfe8f0');rect(g,x,92,3,4,c);glow(g,x+1,93,4,4,c,.6)}
box(g,252,86,8,10,'#cfe8f0');rect(g,253,90,6,5,C.ok);
rect(g,272,62,6,34,'#2a2040');box(g,271,60,8,8,'#3a2a2a');box(g,271,68,8,8,'#3a3420');box(g,271,76,8,8,'#204030');
// REVIEW: four lens podiums, dim until a high-risk change
[[C.red,'R'],[C.warn,'S'],[C.teal,'D'],[C.ok,'L']].forEach(([c],i)=>{const x=294+i*16;box(g,x,92,12,16,mix('#3a2a2a',c,.12));rect(g,x+3,86,6,6,mix(c,'#000',.55));rect(g,x+4,87,4,4,mix(c,'#000',.35))});
// ENGINE (Gentle AI): the rose reactor, conduits, integrations panel, profile lever
const rx=50,ry=134;box(g,rx-4,ry-4,32,6,C.metal);box(g,rx-4,ry+44,32,8,C.metal);
for(let y=ry+2;y<ry+44;y++)for(let x=rx;x<rx+24;x++){const e=Math.abs(x-rx-12)/12;px(g,x,y,e>.85?'#3a2a4a':BY[y&3][x&3]<.55-.45*e?mix(C.neon,'#2a0f2a',.55):'#1a0a20')}

    if(mode==='normal'){for(let x=368;x<381;x++)px(ctx,x,fy-10+Math.round(Math.sin((x-368)/13*Math.PI)*3),C.red)}else for(let y=0;y<9;y++)px(ctx,382,fy-10+y,C.red);
    ctx.drawImage(BOUNCER,368,fy-26)}
  if(mode==='yolo'){box(ctx,366,fy-14,14,9,'#d9d2e6');plain(ctx,'B',368,fy-12,C.ink);plain(ctx,'R',372,fy-12,C.ink);plain(ctx,'B',376,fy-12,C.ink);rect(ctx,372,fy-5,1,5,C.metal);for(let x=366;x<382;x++)px(ctx,x,fy-1,C.red)}
  if(mode==='super-yolo'){rect(ctx,357,162,4,24,C.ink);ctx.save();ctx.globalAlpha=.35;rect(ctx,357,166,16,20,C.warn);ctx.restore();word(ctx,'OPEN',364,150,C.red)}
  // pips
  for(const r of rooms)if(r.role)for(let i=0;i<3;i++){const [x,y,w,h]=pip(r,i),on=i<r.tier;rect(ctx,x,y,w,h,on?C.teal:'#2a1640');if(on){ctx.save();ctx.globalAlpha=.3;rect(ctx,x-1,y-1,w+2,h+2,C.teal);ctx.restore()}}
  // elephant librarian at the reading desk
  ctx.drawImage(ELE,206,F2.y+F2.h-6-20);
  // people
  const list=[...helpers,...agents];
  for(const a of list){const faded=filter&&(a.proj||agents.find(x=>x.id===a.of).proj)!==filter;ctx.save();if(faded)ctx.globalAlpha=.25;
    const sel=a===selected||(hover&&hover.a===a);if(sel){ctx.save();ctx.globalAlpha=.6;rect(ctx,a.x-6,a.fy,13,1,C.teal);ctx.restore()}
    const working=(a.state==='work'||a.kind)&&!paused&&!reduce;const spr=a.spr[working?t%2:0];
    if(a.kind)ctx.drawImage(spr,a.x-6,a.fy-23);else ctx.drawImage(spr,a.x-6,a.fy-23);
    if(a.state==='need'||a.state==='done')ctx.drawImage(BUB[a.state],a.x-6,a.fy-37);
    if(paused&&(a.state==='work'||a.kind)){rect(ctx,a.x-3,a.fy-30,2,5,C.warn);rect(ctx,a.x+1,a.fy-30,2,5,C.warn)}
    ctx.restore()}
  if(hover&&hover.t==='room'){ctx.save();ctx.globalAlpha=.5;const r=hover.r;rect(ctx,r.x,r.y+r.h-1,r.w,1,C.teal);ctx.restore()}
}
renderCrew();draw();
if(!reduce)setInterval(()=>{t+=1;draw()},500);
if(location.hash==='#ask')openEvent(agents[0]);
if(location.hash==='#engine')roomInfo(R('engine'));
</script>
