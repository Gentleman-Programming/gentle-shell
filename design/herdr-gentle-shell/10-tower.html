<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Shell — The tower: one floor per session</title>
<style>
:root{
  --text:#f6eff3;--text-muted:#a78e9b;--text-faint:#76616b;
  --accent:#f095c8;--accent-strong:#ff76c3;--accent-soft:#ffb1dd;--success:#b4e7c7;--warning:#e0c27a;--teal:#5ee6e6;
  --font-mono:"IosevkaTerm NF","Iosevka Term","JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:#0a0612;color:var(--text);font:14px/1.45 var(--font-mono);height:100vh;overflow:hidden;display:grid;place-items:center}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative}
canvas{display:block;image-rendering:pixelated}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,#00000016 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 62%,#00000080 100%)}
.px{background:#0c0714e8;border:2px solid #4a2a5e;box-shadow:inset 0 0 0 2px #0c0714,0 0 0 2px #00000080}
.plan{position:absolute;top:12px;left:12px;padding:6px 10px;display:grid;gap:3px;z-index:2}
.lab{font-size:11px;color:var(--text-muted);letter-spacing:.12em}
.pips{display:flex;gap:3px}.pips i{width:10px;height:13px;background:#2a1640;border:1px solid #4a2a5e}.pips i.on{background:var(--teal);border-color:#9ff5f5}
.val{font-size:12px}
.projects{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:2}
.projects button{display:flex;align-items:center;gap:6px;padding:3px 10px;font-size:12.5px;color:var(--text-muted)}
.projects button[aria-pressed="true"]{color:var(--text);background:#ffffff10}
.projects i{width:9px;height:9px;display:inline-block}.projects .cnt{color:var(--text-faint);font-size:11px}.projects .nd{color:#0c0714;background:var(--warning);font-weight:800;font-size:11px;padding:0 5px}
.pause{position:absolute;top:12px;right:12px;padding:6px 12px;font-weight:700;letter-spacing:.12em;z-index:2}
.pause[aria-pressed="true"]{color:var(--warning);border-color:var(--warning)}
/* floors list: each entry sits next to its floor */
.floors{position:absolute;left:0;top:0;z-index:2}
.fl{position:absolute;left:12px;display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;align-items:center;padding:5px 9px 5px 0;text-align:left;transform:translateY(-50%);width:var(--w)}
.fl .key{grid-row:span 2;align-self:stretch;display:grid;place-items:center;width:30px;color:#0c0714;font-weight:800;font-size:12px}
.fl .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .sub{grid-column:2;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .st{grid-row:span 2;font-weight:800}
.fl[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 2px #0c0714,0 0 0 2px #00000080,0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.st.need{color:var(--warning)}.st.done{color:var(--success)}.st.work{color:var(--teal)}
.newfl{position:absolute;left:12px;padding:4px 10px;font-size:12px;color:var(--text-muted)}
.newfl:hover{color:var(--text);border-color:var(--accent)}
.tip{position:absolute;pointer-events:none;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-140%);z-index:3;display:none}
.sel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:14px;padding:9px 13px;z-index:2;max-width:calc(100% - 24px)}
.sel.open{display:flex}.sel .nm{font-weight:700}.sel .meta{color:var(--text-muted);font-size:12px}
.btn{padding:4px 11px;border:2px solid #4a2a5e;background:#1a0f26;font-weight:700;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-soft)}.btn.primary{background:var(--accent);color:#1a0f26;border-color:var(--accent-soft)}
.event{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 48px));padding:18px 20px;z-index:4;display:none}
.event.open{display:block}.event .from{color:var(--warning);font-weight:700;font-size:13px;letter-spacing:.08em}
.event p{margin:10px 0 12px;font-size:15px}.event ol{list-style:none;display:grid;gap:2px}
.event ol button{width:100%;text-align:left;padding:4px 6px;color:var(--teal);font-size:14px}
.event ol button:hover,.event ol button:focus-visible{color:var(--accent-strong);background:#ffffff08;outline:none}
.event .n{color:var(--text-faint);margin-right:8px}.event .rec{color:var(--text-muted);font-size:12px;margin-left:8px}
.event .ans{margin-top:10px;padding-top:10px;border-top:1px dashed #4a2a5e;color:var(--accent-soft);display:none}.event .ans.show{display:block}
.dim{position:absolute;inset:0;background:#0a061280;z-index:3;display:none}.dim.open{display:block}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" width="480" height="300" aria-label="The Gentleman tower. Each floor is a session with the same rooms; its orchestrator and helpers move between rooms as they work."></canvas>
  <div class="plan px" aria-label="Plan: 64% left this week"><span class="lab">PLAN</span><span class="pips" id="plan"></span><span class="val">64% left · resets Monday</span></div>
  <button class="pause px" id="pause" aria-pressed="false" title="Pause every agent on every floor (Space)">❚❚ PAUSE ALL</button>
  <nav class="floors" id="floors" aria-label="Floors (sessions)"></nav>
  <div class="projects px" id="projects" role="group" aria-label="Projects: one building each"></div>
  <div class="tip px" id="tip"></div>
  <div class="sel px" id="sel" aria-live="polite"></div>
  <div class="dim" id="dim"></div>
  <section class="event px" id="event" role="dialog" aria-modal="true" aria-labelledby="ev-from"><div class="from" id="ev-from"></div><p id="ev-text"></p><ol id="ev-ch"></ol><div class="ans" id="ev-ans" aria-live="polite"></div></section>
</div>
<script>
const W=480,H=300,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={neon:'#ff76c3',acc:'#f095c8',accS:'#ffb1dd',ok:'#b4e7c7',warn:'#e0c27a',info:'#a9c7ee',vio:'#9146ff',vioL:'#b48cff',teal:'#5ee6e6',red:'#ff718f',
  ink:'#0c0714',wall:'#24163a',metal:'#6a5a7e',skin:'#e8b89a',skinD:'#c8957a',hair:'#2a1b27'};
const BY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+.5)/16));
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const rnd=s=>{const v=Math.sin(s*12.9898)*43758.5453;return v-Math.floor(v)};
const px=(g,x,y,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,1,1)},rect=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)};
function dgrad(g,x0,y0,x1,y1,pal){for(let y=y0;y<y1;y++){const t=(y-y0)/Math.max(1,y1-y0)*(pal.length-1),i=Math.min(pal.length-2,t|0),f=t-i;for(let x=x0;x<x1;x++)px(g,x,y,f>BY[y&3][x&3]?pal[i+1]:pal[i])}}
function box(g,x,y,w,h,c){rect(g,x,y,w,h,c);rect(g,x,y,w,1,mix(c,'#ffffff',.22));rect(g,x,y,1,h,mix(c,'#ffffff',.1));rect(g,x,y+h-1,w,1,mix(c,'#000000',.35));rect(g,x+w-1,y,1,h,mix(c,'#000000',.25))}
function glow(g,cx,cy,rx,ry,c,s=1){g.save();g.globalAlpha=.5;for(let y=cy-ry;y<cy+ry;y++)for(let x=cx-rx;x<cx+rx;x++){const d=Math.hypot((x-cx)/rx,(y-cy)/ry);if(d<1&&(1-d)*(1-d)*s>BY[(y|0)&3][(x|0)&3])px(g,x,y,c)}g.restore()}
function sprite(w,h,fn){const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');g.translate(1,1);fn(g);
  const d=g.getImageData(0,0,w+2,h+2),a=(x,y)=>x>=0&&y>=0&&x<w+2&&y<h+2&&d.data[(y*(w+2)+x)*4+3]>0,out=[];
  for(let y=0;y<h+2;y++)for(let x=0;x<w+2;x++)if(!a(x,y)&&(a(x-1,y)||a(x+1,y)||a(x,y-1)||a(x,y+1)))out.push([x,y]);
  g.setTransform(1,0,0,1,0,0);g.fillStyle=C.ink;out.forEach(([x,y])=>g.fillRect(x,y,1,1));return c}
const F={A:['010','101','111','101','101'],C:['011','100','100','100','011'],'-':['000','000','111','000','000'],B:['110','101','110','101','110'],E:['111','100','110','100','111'],G:['011','100','101','101','011'],H:['101','101','111','101','101'],I:['111','010','010','010','111'],
  K:['101','110','100','110','101'],L:['100','100','100','100','111'],M:['10001','11011','10101','10001','10001'],N:['1001','1101','1011','1001','1001'],O:['010','101','101','101','010'],P:['110','101','110','100','100'],
  R:['110','101','110','101','101'],S:['011','100','010','001','110'],T:['111','010','010','010','010'],U:['101','101','101','101','111'],V:['101','101','101','101','010'],W:['10001','10001','10101','11011','10001'],' ':['00','00','00','00','00'],
  '0':['111','101','101','101','111'],'1':['010','110','010','010','111'],'2':['111','001','111','100','111'],'3':['111','001','111','001','111'],'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],'6':['111','100','111','101','111'],'7':['111','001','001','001','001'],'8':['111','101','111','101','111'],'9':['111','101','111','001','111'],'$':['011','110','010','011','110'],'.':['0','0','0','0','1']};
function word(g,s,x,y,c,lit=1){let cx=x;for(const ch of s){const f=F[ch];f.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='1'){if(lit){g.save();g.globalAlpha=.22;rect(g,cx+i-1,y+j-1,3,3,c);g.restore()}rect(g,cx+i,y+j,1,1,c)}}));cx+=f[0].length+1}return cx}
const MUST=['..#.........#..','.#.##.....##.#.','.#..#######..#.','..##.......##..'];

// ---------- the tower ----------
const BX=96,BW=360,FH=46,LOBBY=228;let NF=4,ROOF=44;   // floors stack up from the lobby at 228
const RS=[['map','MAP',46,C.teal,'#132036'],['workshop','WORKSHOP',58,C.neon,'#2a1530'],['lab','LAB',44,C.ok,'#13281f'],['review','REVIEW',44,C.warn,'#221a14'],
  ['engram','ENGRAM',52,C.vio,'#1a1438'],['engine','GENTLE AI',54,C.neon,'#24112a'],['lounge','LOUNGE',40,C.accS,'#2a1626']];
const ROOMS=[];{let x=BX+4;for(const [id,sign,w,col,tint] of RS){ROOMS.push({id,sign,x,w,col,tint});x+=w+2}}
const RX=id=>ROOMS.find(r=>r.id===id);
const PROJECTS=[
  {id:'gentle-ai',sign:'GENTLE-AI',col:C.acc,sessions:[
    {id:'refresh',name:'Token refresh fix',col:C.acc,state:'need',cost:'$0.42',ctx:'38%'},
    {id:'notes',name:'Release notes 4.5.1',col:C.teal,state:'work',cost:'$0.18',ctx:'21%'},
    {id:'triage',name:'Triage #6102',col:C.ok,state:'done',cost:'$0.07',ctx:'done'}]},
  {id:'engram',sign:'ENGRAM',col:C.vioL,sessions:[{id:'sync',name:'Sync conflict UI',col:C.vioL,state:'work',cost:'$0.09',ctx:'12%'}]},
  {id:'gentle-pi',sign:'GENTLE-PI',col:C.teal,sessions:[{id:'status',name:'Herdr status v2',col:C.teal,state:'need',cost:'$0.26',ctx:'30%'}]},
  {id:'gentleman-landing',sign:'LANDING',col:C.warn,sessions:[
    {id:'hero',name:'Hero copy',col:C.warn,state:'done',cost:'$0.31',ctx:'done'},
    {id:'seo',name:'SEO meta tags',col:C.info,state:'work',cost:'$0.04',ctx:'8%'}]},
];
let project=PROJECTS[0],floors=project.sessions;
const fy0=i=>ROOF+i*FH, floorLine=i=>fy0(i)+FH-4;

// ---------- static scene (rebuilt per project) ----------
const bg=document.createElement('canvas');bg.width=W;bg.height=H;const g=bg.getContext('2d');
function buildBg(){g.clearRect(0,0,W,H);
dgrad(g,0,0,W,H,['#08050f','#130a28','#25104a','#4a1568','#7e2080','#b8347e','#ee6a8c']);
for(let i=0;i<120;i++){px(g,rnd(i)*W|0,rnd(i+40)*180|0,rnd(i+7)>.75?C.teal:'#ffffff90')}
for(let y=230;y<290;y++)for(let x=0;x<70;x++){const d=Math.hypot(x-36,y-276);if(d>34)continue;if(y>252&&(y%4)<Math.min(3,(y-252)/5))continue;px(g,x,y,y<246?'#ffe08a':y<262?'#ff9e8a':'#ff6fa8')}
// distant skyline
for(let x=0,i=0;x<W;i++){const w=8+(rnd(i)*14|0),h=20+(rnd(i+3)*50|0);rect(g,x,272-h,w,h,'#120a1e');for(let yy=272-h+3;yy<270;yy+=4)for(let xx=x+2;xx<x+w-1;xx+=3)if(rnd(xx*yy)>.8)px(g,xx,yy,rnd(xx+yy)>.6?C.warn:C.neon);x+=w}
g.save();g.globalAlpha=.55;for(let i=0;i<5;i++)rect(g,0,272+i*i*1.3,W,1,i%2?C.teal:C.neon);for(let i=-16;i<=16;i++)for(let y=272;y<H;y++){const k=(y-272)/28;px(g,276+i*16+i*16*k*2.2,y,C.teal)}g.restore();
// shell
box(g,BX-4,ROOF-6,BW+8,LOBBY-ROOF+48,'#2a1a40');rect(g,BX,ROOF,BW,LOBBY-ROOF+40,C.ink);
g.save();g.globalAlpha=.35;rect(g,BX-5,ROOF-7,BW+10,1,C.neon);g.restore();
// roof: mustache sign, antenna, water tank
box(g,236,18,80,18,'#2a1a40');rect(g,238,20,76,14,C.ink);
g.save();g.globalAlpha=.3;MUST.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='#')rect(g,261+i*2-1,23+j*2-1,4,4,C.neon)}));g.restore();
MUST.forEach((r,j)=>[...r].forEach((b,i)=>{if(b==='#')rect(g,261+i*2,23+j*2,2,2,C.neon)}));
rect(g,420,8,1,30,C.metal);px(g,420,7,C.red);glow(g,420,7,5,5,C.red,.9);
box(g,120,22,22,14,'#3a2a4a');rect(g,122,36,2,2,C.metal);rect(g,138,36,2,2,C.metal);
// one floor = the same rooms, drawn per floor
function drawRoomArt(g,r,y0,floorCol,i){
  const x=r.x,w=r.w,yb=y0+FH-4;
  dgrad(g,x,y0+3,x+w,yb,[mix(r.tint,'#000',.45),r.tint,mix(r.tint,'#000',.1)]);
  for(let xx=x+10;xx<x+w;xx+=12)rect(g,xx,y0+10,1,FH-16,mix(r.tint,'#000',.3));
  rect(g,x+w/2-4,y0+3,8,1,'#fff6e0');glow(g,x+w/2,y0+12,w*.45,14,mix(r.col,'#fff',.5),.45);
  word(g,r.sign,x+3,y0+5,r.col,1);
  switch(r.id){
    case'map':box(g,x+4,y0+14,22,14,'#7a5236');[[x+6,y0+16,C.accS],[x+13,y0+15,'#f6eff3'],[x+19,y0+17,C.teal],[x+8,y0+22,'#f6eff3'],[x+17,y0+22,C.warn]].forEach(([a,b,c])=>{box(g,a,b,4,4,c);px(g,a+1,b,C.red)});
      g.save();g.strokeStyle=C.red;g.globalAlpha=.7;g.beginPath();g.moveTo(x+8.5,y0+16.5);g.lineTo(x+15.5,y0+15.5);g.lineTo(x+20.5,y0+17.5);g.lineTo(x+18.5,y0+23.5);g.lineTo(x+9.5,y0+23.5);g.stroke();g.restore();
      box(g,x+30,yb-10,14,2,'#4a3a5e');rect(g,x+31,yb-8,1,8,'#2a2040');rect(g,x+42,yb-8,1,8,'#2a2040');box(g,x+31,yb-13,12,3,'#3a6ab0');break;
    case'workshop':box(g,x+4,y0+13,22,13,'#3a2a3e');rect(g,x+7,y0+15,1,8,C.metal);rect(g,x+6,y0+15,3,2,C.metal);rect(g,x+12,y0+15,1,9,'#8e6444');rect(g,x+17,y0+16,6,1,C.metal);rect(g,x+22,y0+15,1,8,C.warn);
      box(g,x+28,yb-11,26,3,'#5a3a4a');rect(g,x+29,yb-8,1,8,'#2a2040');rect(g,x+51,yb-8,1,8,'#2a2040');box(g,x+34,yb-20,12,9,'#2a2040');rect(g,x+35,yb-19,10,6,'#000');break;
    case'lab':box(g,x+3,yb-11,24,3,'#5a3a4a');rect(g,x+4,yb-8,1,8,'#2a2040');rect(g,x+25,yb-8,1,8,'#2a2040');
      for(let k=0;k<5;k++){const c=k<1?C.red:C.ok;rect(g,x+5+k*4,yb-18,2,7,'#cfe8f0');rect(g,x+5+k*4,yb-15,2,4,c)}glow(g,x+14,yb-14,12,5,C.ok,.5);
      rect(g,x+35,y0+12,4,24,'#2a2040');box(g,x+34,y0+11,6,6,'#3a2a2a');box(g,x+34,y0+17,6,6,'#3a3420');box(g,x+34,y0+23,6,6,'#204030');break;
    case'review':for(let k=0;k<4;k++){const c=[C.red,C.warn,C.teal,C.ok][k];box(g,x+3+k*10,yb-11,8,11,mix('#3a2a2a',c,.12));rect(g,x+5+k*10,yb-16,4,4,mix(c,'#000',.4))}break;
    case'engram':for(let s=0;s<2;s++){const sx=x+3+s*17;box(g,sx,y0+12,15,FH-16,'#3a2a3e');for(let k=0;k<3;k++){rect(g,sx+1,y0+19+k*8,13,1,'#24182a');for(let bx=sx+2;bx<sx+14;bx+=2){const h=4+(rnd(bx+k*9+i*31)*3|0);rect(g,bx,y0+19+k*8-h,1,h,[C.vio,C.info,C.accS,C.ok,C.teal][(rnd(bx*7+k+i)*5)|0])}}}
      box(g,x+38,yb-9,12,2,'#6a4a3a');rect(g,x+46,yb-16,1,7,C.metal);rect(g,x+44,yb-17,5,2,C.warn);glow(g,x+46,yb-12,8,6,C.warn,.7);break;
    case'engine':{const rx=x+5,ry=y0+12;box(g,rx-2,ry-2,14,3,C.metal);box(g,rx-2,yb-4,14,4,C.metal);
      for(let yy=ry+1;yy<yb-4;yy++)for(let xx=rx;xx<rx+10;xx++){const e=Math.abs(xx-rx-5)/5;px(g,xx,yy,BY[yy&3][xx&3]<.6-.5*e?mix(C.neon,'#2a0f2a',.5):'#1a0a20')}
      glow(g,rx+5,ry+13,12,16,C.neon,.8);['.##.','#..#','.##.','..#.','.##.'].forEach((rr,j)=>[...rr].forEach((b,k)=>{if(b==='#')rect(g,rx+3+k,ry+5+j*2,1,2,j<3?C.neon:'#4f9a7a')}));
      box(g,x+20,y0+13,30,10,'#d9d2e6');rect(g,x+21,y0+14,28,8,'#efeaf6');
      box(g,x+22,yb-14,26,12,'#2a2040');for(let k=0;k<6;k++){rect(g,x+24+(k%3)*8,yb-12+(k/3|0)*5,5,3,'#000');rect(g,x+25+(k%3)*8,yb-11+(k/3|0)*5,3,1,k===4?C.warn:C.ok)}break}
    case'lounge':box(g,x+6,y0+12,22,12,'#24163a');dgrad(g,x+7,y0+13,x+27,y0+23,['#2e1158','#8e2480','#ff6fa8','#ff9e8a']);rect(g,x+16,y0+13,1,10,'#24163a');

  for(let i=0;i<NF;i++){const r=RX('engram');ctx.save();if(i!==cur)ctx.globalAlpha=.6;ctx.drawImage(ELE,r.x+36,floorLine(i)-12);ctx.restore()}
  for(const p of people){const fb=floorLine(p.floor);ctx.save();if(p.floor!==cur)ctx.globalAlpha=.7;
    const moving=(p.walking||p.state==='work'||p.kind==='helper')&&!paused&&!reduce;const spr=p.spr[moving?t%2:0];
    if(p.flip){ctx.translate(Math.round(p.x),0);ctx.scale(-1,1);ctx.drawImage(spr,-Math.floor(spr.width/2),fb-spr.height+1);ctx.setTransform(1,0,0,1,0,0)}
    else ctx.drawImage(spr,Math.round(p.x)-Math.floor(spr.width/2),fb-spr.height+1);
    if(p.kind==='orch'&&(p.state==='need'||p.state==='done'))ctx.drawImage(BUB[p.state],Math.round(p.x)-5,fb-spr.height-10);
    if(hover&&hover.p===p){const w=p.nm.length*4+6,x0=Math.round(p.x)-w/2,y0=fb-spr.height-(p.kind==='orch'&&p.state!=='work'?20:9);box(ctx,x0,y0,w,7,'#0c0714');ctx.save();ctx.font='5px monospace';ctx.restore()}
    if(paused&&(p.state==='work'||p.kind==='helper')){rect(ctx,p.x-3,fb-spr.height-6,2,4,C.warn);rect(ctx,p.x+1,fb-spr.height-6,2,4,C.warn)}
    ctx.restore()}
  // lobby: review switch, persona, the door
  rect(ctx,BX+251,LOBBY+(review?15:20),2,5,review?C.warn:'#5a4a4a');
  const bx=BX+176;if(persona){rect(ctx,bx+2,LOBBY+38-27,6,1,C.neon);px(ctx,bx+1,LOBBY+38-28,C.neon);px(ctx,bx+8,LOBBY+38-28,C.neon)}
  const dy=LOBBY+38,dx=BX+BW+4;
  if(mode==='normal'||mode==='auto'){for(const xx of [dx+1,dx+17]){rect(ctx,xx,dy-11,2,11,C.warn);rect(ctx,xx-1,dy-12,4,2,C.warn)}
    if(mode==='normal')for(let xx=dx+3;xx<dx+17;xx++)px(ctx,xx,dy-9+Math.round(Math.sin((xx-dx-3)/14*Math.PI)*3),C.red);else for(let k=0;k<8;k++)px(ctx,dx+18,dy-9+k,C.red);
    ctx.drawImage(BOUNCER,dx+3,dy-24)}
  if(mode==='yolo'){box(ctx,dx+2,dy-13,14,8,'#d9d2e6');word(ctx,'BRB',dx+3,dy-11,C.ink,0)}
  if(mode==='super-yolo'){ctx.save();ctx.globalAlpha=.35;rect(ctx,BX+BW-8,LOBBY+6,20,32,C.warn);ctx.restore();word(ctx,'OPEN',dx-2,LOBBY-2,C.red)}
  if(hover&&hover.t==='room'){ctx.save();ctx.globalAlpha=.6;rect(ctx,hover.r.x,fy0(hover.i)+FH-5,hover.r.w,1,C.teal);ctx.restore()}
}
function renderProjects(){const n=$('projects');n.innerHTML='';PROJECTS.forEach((pr,k)=>{const need=pr.sessions.filter(s=>s.state==='need').length;
  const b=document.createElement('button');b.setAttribute('aria-pressed',pr===project);b.title=`${pr.id} (⌥${k+1})`;
  b.innerHTML=`<i style="background:${pr.col}"></i>${pr.id}<span class="cnt">${pr.sessions.length}</span>${need?'<span class="nd">?</span>':''}`;b.onclick=()=>setProject(pr);n.appendChild(b)})}
function setProject(pr){project=pr;floors=pr.sessions;NF=floors.length;ROOF=LOBBY-NF*FH;cur=0;buildBg();buildPeople();renderProjects();fit();goFloor(0)}
setProject(PROJECTS[0]);requestAnimationFrame(step);
if(location.hash==='#ask')openEvent(0);
</script>
