<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Shell — The tower, painted</title>
<style>
:root{
  --text:#f6eff3;--text-muted:#a78e9b;--text-faint:#76616b;
  --accent:#f095c8;--accent-strong:#ff76c3;--accent-soft:#ffb1dd;--success:#b4e7c7;--warning:#e0c27a;--teal:#5ee6e6;
  --font-mono:"IosevkaTerm NF","Iosevka Term","JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:#07040d;color:var(--text);font:14px/1.45 var(--font-mono);height:100vh;overflow:hidden;display:grid;place-items:center}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative}
canvas{display:block;image-rendering:pixelated}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 65%,#00000070 100%)}
.px{background:#0d0816e6;border:1px solid #5a3a6e;box-shadow:0 0 0 1px #00000090,0 8px 24px #00000060;border-radius:3px}
.plan{position:absolute;top:12px;left:12px;padding:7px 11px;display:grid;gap:4px;z-index:2}
.lab{font-size:11px;color:var(--text-muted);letter-spacing:.12em}
.pips{display:flex;gap:3px}.pips i{width:10px;height:13px;background:#2a1640;border-radius:1px}.pips i.on{background:var(--teal);box-shadow:0 0 6px #5ee6e680}
.val{font-size:12px}
.projects{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:2}
.projects button{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:12.5px;color:var(--text-muted);border-radius:2px}
.projects button[aria-pressed="true"]{color:var(--text);background:#ffffff12}
.projects i{width:9px;height:9px;border-radius:2px;display:inline-block}.projects .cnt{color:var(--text-faint);font-size:11px}
.projects .nd{color:#0c0714;background:var(--warning);font-weight:800;font-size:11px;padding:0 5px;border-radius:2px}
.pause{position:absolute;top:12px;right:12px;padding:7px 12px;font-weight:700;letter-spacing:.12em;z-index:2}
.pause[aria-pressed="true"]{color:var(--warning);border-color:var(--warning)}
.floors{position:absolute;left:0;top:0;z-index:2}
.fl{position:absolute;left:12px;display:grid;grid-template-columns:auto 1fr auto;gap:0 9px;align-items:center;padding:6px 10px 6px 0;text-align:left;transform:translateY(-50%);width:var(--w);overflow:hidden}
.fl .key{grid-row:span 2;align-self:stretch;display:grid;place-items:center;width:34px;color:#0c0714;font-weight:800;font-size:12px}
.fl .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .sub{grid-column:2;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .st{grid-row:span 2;font-weight:800}
.fl[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px #00000090,0 0 20px color-mix(in srgb,var(--c) 40%,transparent)}
.st.need{color:var(--warning)}.st.done{color:var(--success)}.st.work{color:var(--teal)}
.prog{position:absolute;left:12px;display:grid;gap:3px;padding:6px 9px;text-align:left;width:var(--w)}
.prog:hover,.prog[aria-expanded="true"]{border-color:var(--accent)}
.segs{display:flex;gap:2px}.segs i{flex:1;height:6px;border-radius:1px}
.segs i.in_progress{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.segs i.in_progress{animation:none}}
.prog .now{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prog .now b{color:var(--text);font-weight:600}
.todo{position:absolute;width:380px;padding:12px 14px;z-index:3;display:none;transform:translateY(-50%)}
.todo.open{display:block}.todo h3{font-size:13px;display:flex;gap:8px;align-items:center;margin-bottom:8px}.todo h3 small{color:var(--text-muted);font-weight:400}
.todo ol{list-style:none;display:grid;gap:6px}.todo li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:start;font-size:12.5px}
.todo .ic{width:12px;height:12px;border-radius:2px;margin-top:3px;display:grid;place-items:center;font-size:9px;color:#0c0714;font-weight:800}
.todo .meta{grid-column:2;font-size:11px;color:var(--text-muted);margin-top:-4px}.todo .st{font-size:10.5px;color:var(--text-muted);white-space:nowrap}
.todo li.done span:nth-child(2){color:var(--text-muted)}.todo li.dropped span:nth-child(2){text-decoration:line-through;color:var(--text-faint)}
.todo li.blocked .st{color:var(--warning)}.todo li.in_progress .st{color:var(--accent-strong)}
.newfl{position:absolute;left:12px;padding:5px 11px;font-size:12px;color:var(--text-muted);transform:translateY(-50%)}
.newfl:hover{color:var(--text);border-color:var(--accent)}
.tip{position:absolute;pointer-events:none;padding:4px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-140%);z-index:3;display:none}
.sel{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;align-items:center;gap:14px;padding:10px 14px;z-index:2;max-width:calc(100% - 24px)}
.sel.open{display:flex}.sel .nm{font-weight:700}.sel .meta{color:var(--text-muted);font-size:12px}
.btn{padding:5px 11px;border:1px solid #5a3a6e;background:#1a0f26;font-weight:700;font-size:12.5px;white-space:nowrap;border-radius:2px}
.btn:hover{border-color:var(--accent);color:var(--accent-soft)}.btn.primary{background:var(--accent);color:#1a0f26;border-color:var(--accent-soft)}
.event{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 48px));padding:20px 22px;z-index:4;display:none}
.event.open{display:block}.event .from{color:var(--warning);font-weight:700;font-size:13px;letter-spacing:.08em}
.event p{margin:10px 0 12px;font-size:15px}.event ol{list-style:none;display:grid;gap:2px}
.event ol button{width:100%;text-align:left;padding:5px 7px;color:var(--teal);font-size:14px;border-radius:2px}
.event ol button:hover,.event ol button:focus-visible{color:var(--accent-strong);background:#ffffff0a;outline:none}
.event .n{color:var(--text-faint);margin-right:8px}.event .rec{color:var(--text-muted);font-size:12px;margin-left:8px}
.event .ans{margin-top:10px;padding-top:10px;border-top:1px dashed #5a3a6e;color:var(--accent-soft);display:none}.event .ans.show{display:block}
.intercom{position:absolute;top:58px;right:12px;bottom:12px;width:440px;display:none;flex-direction:column;z-index:3}
.intercom.open{display:flex}
.ic-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #5a3a6e}
.ic-h .key{padding:3px 7px;color:#0c0714;font-weight:800;font-size:12px;border-radius:2px}
.ic-h .t{font-weight:700}.ic-h .s{font-size:11px;color:var(--text-muted)}
.grill{margin-left:auto;display:grid;grid-template-columns:repeat(5,3px);gap:2px}.grill i{width:3px;height:3px;border-radius:50%;background:#4a3a5e}
.ic-x{color:var(--text-muted);padding:2px 6px}.ic-x:hover{color:var(--text)}
.ic-log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;scrollbar-color:#3a2a4a transparent}
.m .who{font-size:11px;color:var(--text-muted);margin-bottom:2px}
.m.you{align-self:flex-end;max-width:88%;background:#2a1838;padding:8px 11px;border-radius:3px}
.m.helper{font-size:12px;color:var(--text-muted);padding-left:10px;border-left:2px solid #3a2a4a}.m.helper b{color:var(--teal);font-weight:600}
.art{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:7px;border:1px solid #5a3a6e;border-radius:3px;background:#140c1e;text-align:left;width:100%}
.art:hover{border-color:var(--accent)}.art .th{width:48px;height:36px;border-radius:2px;display:block}.art b{font-size:13px}.art small{display:block;color:var(--text-muted);font-size:11px}
.q{border:1px solid #e0c27a80;border-left:3px solid var(--warning);padding:9px 11px;border-radius:3px}
.q ol{list-style:none;margin-top:6px}.q ol button{color:var(--teal);text-align:left;padding:3px 0;font-size:13px}.q ol button:hover{color:var(--accent-strong)}
.ic-in{border-top:1px solid #5a3a6e;padding:10px 12px}
.ic-in textarea{width:100%;background:#140c1e;border:1px solid #5a3a6e;border-radius:3px;color:var(--text);font:13.5px/1.45 var(--font-mono);padding:8px 10px;resize:none}
.ic-in textarea:focus{outline:none;border-color:var(--accent)}
.ic-row{display:flex;gap:6px;margin-top:6px;align-items:center;font-size:11.5px;color:var(--text-muted)}
.chip{border:1px solid #3a2a4a;border-radius:2px;padding:2px 7px}.chip:hover{border-color:var(--accent);color:var(--text)}
.viewer{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 48px));max-height:86%;display:none;flex-direction:column;z-index:5}
.viewer.open{display:flex}.vw-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #5a3a6e}.vw-h small{color:var(--text-muted)}
.vw-b{padding:16px;overflow:auto;background:#f3ecdf;color:#2a1838;font-family:Georgia,serif}
.vw-b h3{font-family:var(--font-mono);font-size:16px;margin:4px 0 8px}.vw-b li{margin:3px 0 3px 18px}.vw-b code{font-family:var(--font-mono);background:#e4dac8;padding:0 4px}
.vw-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #5a3a6e;justify-content:flex-end}
.room{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 48px));height:min(560px,86%);display:none;z-index:5;flex-direction:column}
.room.open{display:flex}.rv-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #5a3a6e}.rv-h small{color:var(--text-muted)}
.rv-b{flex:1;display:grid;min-height:0}
.lib{grid-template-columns:330px 1fr;background:linear-gradient(180deg,#2a1838,#1a0f26)}
.shelves{padding:12px;overflow:auto;display:grid;gap:12px;border-right:1px solid #3a2a4a}
.search{width:100%;background:#140c1e;border:1px solid #5a3a6e;border-radius:3px;color:var(--text);font:13px var(--font-mono);padding:7px 9px}
.search:focus{outline:none;border-color:var(--accent)}
.shelf h4{font-size:11px;letter-spacing:.12em;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between}
.spines{display:flex;gap:3px;align-items:flex-end;padding:0 4px 4px;border-bottom:4px solid #5a3a4a;min-height:62px}
.spine{width:22px;border-radius:2px 2px 0 0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;color:#f6eff3cc;padding:5px 0;text-align:left;overflow:hidden;white-space:nowrap;box-shadow:inset -3px 0 0 #00000040,inset 2px 0 0 #ffffff20}
.spine:hover,.spine[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.page{margin:14px;padding:22px 26px;background:#f3ecdf;color:#2a1838;border-radius:3px;font:15px/1.6 Georgia,serif;overflow:auto;box-shadow:0 10px 30px #00000070}
.page h3{font:700 17px var(--font-mono);margin-bottom:4px}.page .tag{font:11px var(--font-mono);color:#7a6a88;margin-bottom:12px}
.page dt{font:700 12px var(--font-mono);color:#8a2f6a;margin-top:10px;letter-spacing:.06em}.page dd{margin:2px 0 0}
.page code{font-family:var(--font-mono);background:#e4dac8;padding:0 4px}
.page .acts{margin-top:16px;display:flex;gap:8px}
.page .btn{color:var(--text);font-family:var(--font-mono)}.page .btn.primary{color:#1a0f26}
.tab{grid-template-columns:1fr 300px;background:radial-gradient(ellipse at 30% 20%,#3a1a3a,#140a1a)}
.receipt{margin:16px auto;width:min(380px,90%);background:#f6f1e6;color:#2a1838;padding:18px 20px 26px;font:13px/1.55 var(--font-mono);overflow:auto;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}
.receipt h3{text-align:center;font-size:15px;letter-spacing:.2em}.receipt .c{text-align:center;color:#7a6a88;font-size:11px;margin-bottom:10px}
.receipt .r{display:flex;justify-content:space-between;gap:10px}.receipt .r small{color:#7a6a88}.receipt hr{border:0;border-top:1px dashed #b8aec8;margin:8px 0}
.receipt .tot{font-weight:800;font-size:15px}
.bars{display:flex;gap:5px;align-items:flex-end;height:70px;margin:8px 0 2px}.bars i{flex:1;background:#c2456f;border-radius:1px}.bars i.today{background:#ff76c3;outline:1px solid #2a1838}
.days{display:flex;gap:5px;font-size:10px;color:#7a6a88}.days span{flex:1;text-align:center}
.side2{padding:16px;border-left:1px solid #3a2a4a;display:grid;gap:12px;align-content:start}
.side2 .k{font-size:11px;color:var(--text-muted);letter-spacing:.1em}.side2 .v{font-size:20px;font-weight:700}
.limit{display:flex;gap:6px;align-items:center}.limit input{width:70px;background:#140c1e;border:1px solid #5a3a6e;color:var(--text);font:13px var(--font-mono);padding:5px 7px;border-radius:2px}
.dim{position:absolute;inset:0;background:#07040d80;z-index:3;display:none}.dim.open{display:block}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" width="720" height="450" aria-label="The Gentleman tower, painted. Each project is a building, each session a floor; orchestrators and their helpers move between rooms."></canvas>
  <div class="plan px" aria-label="Plan: 64% left this week"><span class="lab">PLAN</span><span class="pips" id="plan"></span><span class="val">64% left · resets Monday</span></div>
  <div class="projects px" id="projects" role="group" aria-label="Projects: one building each"></div>
  <button class="pause px" id="pause" aria-pressed="false" title="Pause every agent (Space)">❚❚ PAUSE ALL</button>
  <nav class="floors" id="floors" aria-label="Floors (sessions)"></nav>
  <section class="todo px" id="todo" aria-live="polite" aria-label="Floor tasks"></section>
  <div class="tip px" id="tip"></div>
  <div class="sel px" id="sel" aria-live="polite"></div>
  <div class="dim" id="dim"></div>
  <aside class="intercom px" id="ic" aria-label="Floor intercom"><div class="ic-h" id="ic-h"></div><div class="ic-log" id="ic-log" role="log" aria-live="polite"></div>
    <div class="ic-in"><label class="sr" for="ic-t" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message</label><textarea id="ic-t" rows="2"></textarea>
    <div class="ic-row"><button class="chip">@ helpers</button><button class="chip">/ commands</button><button class="chip">＋ attach</button><span style="flex:1"></span><span>T talk · Esc close</span><button class="btn primary" id="ic-send">Send</button></div></div></aside>
  <section class="room px" id="rv" role="dialog" aria-modal="true" aria-labelledby="rv-t"><div class="rv-h"><b id="rv-t"></b><small id="rv-s"></small><span style="flex:1"></span><button class="ic-x" id="rv-x" aria-label="Close">✕</button></div><div class="rv-b" id="rv-b"></div></section>
  <section class="viewer px" id="vw" role="dialog" aria-modal="true" aria-labelledby="vw-t"><div class="vw-h"><b id="vw-t"></b><small id="vw-s"></small><span style="flex:1"></span><button class="ic-x" id="vw-x" aria-label="Close">✕</button></div><div class="vw-b" id="vw-b"></div>
    <div class="vw-f"><button class="btn">Download</button><button class="btn primary" id="vw-ask">Ask about this</button></div></section>
  <section class="event px" id="event" role="dialog" aria-modal="true" aria-labelledby="ev-from"><div class="from" id="ev-from"></div><p id="ev-text"></p><ol id="ev-ch"></ol><div class="ans" id="ev-ans" aria-live="polite"></div></section>
</div>
<script>
const W=720,H=450,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={neon:'#ff76c3',acc:'#f095c8',accS:'#ffb1dd',ok:'#b4e7c7',warn:'#e0c27a',info:'#a9c7ee',vio:'#9146ff',vioL:'#b48cff',teal:'#5ee6e6',red:'#ff718f',ink:'#0c0714'};
const rnd=s=>{const v=Math.sin(s*12.9898)*43758.5453;return v-Math.floor(v)};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

// ---------- painting helpers ----------
function lg(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr}
function rg(g,x,y,r,stops){const gr=g.createRadialGradient(x,y,0,x,y,r);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr}
function fillR(g,x,y,w,h,f){g.fillStyle=f;g.fillRect(x,y,w,h)}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ell(g,x,y,rx,ry,f){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=f;g.fill()}
function light(g,x,y,r,col,a=.5,op='lighter'){g.save();g.globalCompositeOperation=op;g.globalAlpha=a;g.fillStyle=rg(g,x,y,r,[[0,col],[1,'rgba(0,0,0,0)']]);g.fillRect(x-r,y-r,r*2,r*2);g.restore()}
function cone(g,x,y,w,h,col,a=.22){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=a;g.beginPath();g.moveTo(x-3,y);g.lineTo(x+3,y);g.lineTo(x+w/2,y+h);g.lineTo(x-w/2,y+h);g.closePath();g.fillStyle=lg(g,0,y,0,y+h,[[0,col],[1,'rgba(0,0,0,0)']]);g.fill();g.restore()}
// noise texture for surfaces
const NOISE=mk(128,128);{const n=NOISE.getContext('2d'),d=n.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)}
function grain(g,x,y,w,h,a=.07){g.save();g.globalAlpha=a;g.globalCompositeOperation='overlay';g.fillStyle=g.createPattern(NOISE,'repeat');g.fillRect(x,y,w,h);g.restore()}
function neonText(g,s,x,y,col,size=11,align='left'){g.save();g.font=`700 ${size}px "Iosevka Term","JetBrains Mono",ui-monospace,monospace`;g.textAlign=align;g.textBaseline='top';
  g.shadowColor=col;g.shadowBlur=8;g.fillStyle=col;g.fillText(s,x,y);g.shadowBlur=3;g.fillStyle='#fff';g.globalAlpha=.6;g.fillText(s,x,y);g.restore()}
// the VGA finish: quantize to a limited palette with a soft ordered dither
const B4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16-.5);
function finish(cnv,levels=22,amt=.55,alphaCut=false){const g=cnv.getContext('2d'),d=g.getImageData(0,0,cnv.width,cnv.height),a=d.data,w=cnv.width,st=255/levels;
  for(let y=0;y<cnv.height;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,b=B4[(y&3)*4+(x&3)]*st*amt;
    for(let k=0;k<3;k++)a[i+k]=Math.max(0,Math.min(255,Math.round((a[i+k]+b)/st)*st));if(alphaCut)a[i+3]=a[i+3]>110?255:0}
  g.putImageData(d,0,0);return cnv}

// ---------- data ----------
const PROJECTS=[
  {id:'gentle-ai',col:C.acc,sessions:[
    {id:'refresh',name:'Token refresh fix',col:C.acc,state:'need',cost:'$0.42',ctx:'38%'},
    {id:'notes',name:'Release notes 4.5.1',col:C.teal,state:'work',cost:'$0.18',ctx:'21%'},
    {id:'triage',name:'Triage #6102',col:C.ok,state:'done',cost:'$0.07',ctx:'done'}]},
  {id:'engram',col:C.vioL,sessions:[{id:'sync',name:'Sync conflict UI',col:C.vioL,state:'work',cost:'$0.09',ctx:'12%'}]},
  {id:'gentle-pi',col:C.teal,sessions:[{id:'status',name:'Herdr status v2',col:C.teal,state:'need',cost:'$0.26',ctx:'30%'}]},
  {id:'gentleman-landing',col:C.warn,sessions:[{id:'hero',name:'Hero copy',col:C.warn,state:'done',cost:'$0.31',ctx:'done'},{id:'seo',name:'SEO meta tags',col:C.info,state:'work',cost:'$0.04',ctx:'8%'}]},
];

  for(let i=0;i<NF;i++){const f=floors[i];if(!ARTS[f.id])continue;const y0=fy0(i),mp=RX('map'),wk=RX('workshop');
    if(x>=mp.x+43&&x<=mp.x+60&&y>=y0+26&&y<=y0+42)return{t:'art',i,id:'flow'};if(x>=wk.x+65&&x<=wk.x+78&&y>=y0+63&&y<=y0+70)return{t:'art',i,id:'plan'};if(x>=wk.x+43&&x<=wk.x+58&&y>=y0+27&&y<=y0+40)return{t:'art',i,id:'shot'}}
  for(const p of people){const fb=floorLine(p.floor);if(Math.abs(x-p.x)<9&&y>fb-48&&y<fb+2)return{t:'person',p}}
  if(x>=BX+BW-16&&y>=LOBBY&&y<=GROUND)return{t:'door'};if(x>=BX+398&&x<=BX+424&&y>=GROUND-64&&y<=GROUND-10)return{t:'bust'};
  if(x>=BX+454&&x<=BX+468&&y>=LOBBY+26&&y<=LOBBY+48)return{t:'switch'};
  for(let i=0;i<NF;i++){const y0=fy0(i);if(y<y0||y>=y0+FH)continue;if(x>=BX-28&&x<BX)return{t:'floor',i};
    for(const r of ROOMS)if(x>=r.x&&x<r.x+r.w){if(r.id==='engine'&&x>=r.x+40&&x<=r.x+74&&y>=y0+28&&y<=y0+44)return{t:'meter',i};return{t:'room',r,i}}}return null}

  if(h.t==='door')return`The door · permissions: ${mode}`;if(h.t==='bust')return`Persona: ${persona?'gentleman':'neutral'}`;if(h.t==='switch')return`Review mode: ${review?'on':'off'}`;

addEventListener('resize',fit);
let last=performance.now(),acc=0,tick=0,bf=0;
function step(now){const dt=Math.min(.2,(now-last)/1000);last=now;acc+=dt;
  if(!paused&&!reduce)for(const p of people){if(p.kind!=='helper'||p.route.length<2)continue;
    if(Math.abs(p.tx-p.x)<.5){p.walking=0;p.wait-=dt;if(p.wait<=0){p.ri=(p.ri+1)%p.route.length;p.room=p.route[p.ri];p.tx=roomX(p.room,12);p.wait=6+rnd(p.x)*6}}
    else{p.walking=1;p.x+=Math.sign(p.tx-p.x)*Math.min(Math.abs(p.tx-p.x),22*dt);p.flip=p.tx<p.x}}
  for(const p of people){const a=animOf(p);if(p.anim!==a){p.anim=a;p.f=0}if(!reduce)p.f+=dt*FPS[a]}bf+=dt*3;
  if(acc>=1/12){acc=0;tick++;t=tick>>2;draw()}requestAnimationFrame(step)}
function draw(){ctx.imageSmoothingEnabled=false;ctx.drawImage(bg,0,0);
  for(let i=0;i<NF;i++){const y0=fy0(i),f=floors[i],en=RX('engine'),wk=RX('workshop');
    ctx.save();ctx.font='800 10px "Iosevka Term","JetBrains Mono",monospace';ctx.fillStyle='#1a1028';ctx.fillText(f.cost,en.x+44,y0+40);ctx.restore();
    // CRT text lines in the workshop
    for(let k=0;k<4;k++){const w=f.state==='work'&&!paused?4+((t+k*3+i)%10):f.state==='need'?12:4;ctx.fillStyle=f.state==='need'?C.warn:C.neon;ctx.globalAlpha=.85;ctx.fillRect(wk.x+55,y0+84-30+k*3,w,1)}ctx.globalAlpha=1;
    if(i!==cur){ctx.save();ctx.globalAlpha=.28;ctx.fillStyle='#07040d';ctx.fillRect(BX,y0,BW,FH);ctx.restore()}
    else{ctx.save();ctx.shadowColor=f.col;ctx.shadowBlur=10;ctx.fillStyle=f.col;ctx.fillRect(BX-2,y0,2,FH);ctx.fillRect(BX+BW,y0,2,FH);ctx.restore()}
    const er=RX('engram');ctx.drawImage(ELE,er.x+58,floorLine(i)-24);if(!reduce&&Math.floor(bf+i)%5===0){ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#2a8a9a';ctx.beginPath();ctx.ellipse(er.x+77,floorLine(i)-13,3,4.5,0,0,7);ctx.fill();ctx.restore()}
    {const mp=RX('map'),ts=(TASKS[f.id]||[]).filter(x=>x.s!=='dropped').slice(0,6);ts.forEach((x,k)=>{const nx=mp.x+8+(k%3)*10,ny=y0+30+(k/3|0)*11;
      ctx.fillStyle=x.s==='done'?'#e8f4ec':x.s==='pending'?'#d8d0c4':'#f6eff3';ctx.fillRect(nx,ny,8,8);ctx.fillStyle='#9a8aa0';ctx.fillRect(nx+1,ny+3,6,1);ctx.fillRect(nx+1,ny+5,4,1);
      if(x.s==='done'){ctx.strokeStyle='#2a8a5a';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(nx+1.5,ny+4.5);ctx.lineTo(nx+3.5,ny+6.5);ctx.lineTo(nx+7,ny+1.5);ctx.stroke()}
      const pc=x.s==='in_progress'?C.neon:x.s==='blocked'?C.warn:x.s==='done'?'#5a9a6a':'#8a7a8a';ctx.save();if(x.s==='in_progress'||x.s==='blocked'){ctx.shadowColor=pc;ctx.shadowBlur=6}ctx.fillStyle=pc;ctx.beginPath();ctx.arc(nx+4,ny,1.5,0,7);ctx.fill();ctx.restore()})}
    if(ARTS[f.id]){const mp=RX('map'),b=y0+84;ctx.save();ctx.translate(mp.x+44,y0+28);ctx.rotate(.06);ctx.fillStyle='#2a4a8a';ctx.fillRect(0,0,14,11);ctx.strokeStyle='#cfe0ff';ctx.lineWidth=.6;ctx.strokeRect(2,2,4,3);ctx.strokeRect(8,6,4,3);ctx.beginPath();ctx.moveTo(6,3.5);ctx.lineTo(8,7);ctx.stroke();ctx.restore();
      ctx.save();ctx.shadowColor=C.neon;ctx.shadowBlur=6;ctx.fillStyle=C.neon;ctx.beginPath();ctx.arc(mp.x+51,y0+28,1.6,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle='#e0b84a';ctx.fillRect(wk.x+66,b-19,11,3);ctx.fillStyle='#c89a3a';ctx.fillRect(wk.x+66,b-17,11,1);
      ctx.fillStyle='#8a6a4a';ctx.fillRect(wk.x+44,y0+28,13,11);ctx.fillStyle='#e4dcee';ctx.fillRect(wk.x+45,y0+29,11,9);ctx.fillStyle='#2a1838';ctx.fillRect(wk.x+46,y0+30,9,2);ctx.fillStyle=C.accS;ctx.fillRect(wk.x+47,y0+35,7,2)}}
  for(const p of people){const fb=floorLine(p.floor),fs=frames(p.look,p.anim||animOf(p)),s=fs[Math.floor(p.f||0)%fs.length];
    ctx.save();if(p.floor!==cur)ctx.globalAlpha=.75;
    ctx.globalAlpha*=.35;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(p.x,fb,8,2,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha/=.35;
    if(p.flip){ctx.translate(Math.round(p.x),0);ctx.scale(-1,1);ctx.drawImage(s,-15,fb-49)}else ctx.drawImage(s,Math.round(p.x)-15,fb-49);ctx.restore();
    if(p.kind==='orch'&&(p.state==='need'||p.state==='done'))ctx.drawImage(BUB[p.state],Math.round(p.x)-9,fb-64);
    if(paused&&(p.state==='work'||p.kind==='helper')){ctx.fillStyle=C.warn;ctx.fillRect(p.x-4,fb-56,3,7);ctx.fillRect(p.x+1,fb-56,3,7)}}
  // lobby live bits
  ctx.fillStyle=review?C.warn:'#5a4a4a';ctx.fillRect(BX+459,LOBBY+(review?30:38),4,7);
  if(persona){const bx=BX+411,by=GROUND-50;ctx.save();ctx.shadowColor=C.neon;ctx.shadowBlur=6;ctx.strokeStyle=C.neon;ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(bx-5,by-1);ctx.quadraticCurveTo(bx,by-3,bx+5,by-1);ctx.stroke();ctx.restore()}
  const dx=BX+BW+4,dy=GROUND;
  if(mode==='normal'||mode==='auto'){for(const xx of [dx+2,dx+26]){ctx.fillStyle='#c8a060';ctx.fillRect(xx,dy-16,2,16);ctx.beginPath();ctx.arc(xx+1,dy-17,2,0,7);ctx.fill()}
    ctx.strokeStyle='#c83a5a';ctx.lineWidth=2;ctx.beginPath();if(mode==='normal'){ctx.moveTo(dx+3,dy-14);ctx.quadraticCurveTo(dx+15,dy-6,dx+27,dy-14)}else{ctx.moveTo(dx+27,dy-14);ctx.lineTo(dx+28,dy-3)}ctx.stroke();{const fs=frames(BOUNCER_LOOK,'idle');ctx.drawImage(fs[Math.floor(bf)%fs.length],dx,dy-49)}}
  if(mode==='yolo'){ctx.fillStyle='#e4dcee';ctx.fillRect(dx+4,dy-22,20,10);ctx.fillStyle='#1a1028';ctx.font='800 8px monospace';ctx.fillText('BRB',dx+7,dy-14)}
  if(mode==='super-yolo'){ctx.save();ctx.globalAlpha=.4;ctx.fillStyle=C.warn;ctx.fillRect(BX+BW-14,LOBBY+14,30,GROUND-LOBBY-24);ctx.restore();ctx.save();ctx.font='800 11px monospace';ctx.shadowColor=C.red;ctx.shadowBlur=8;ctx.fillStyle=C.red;ctx.fillText('OPEN',dx-2,LOBBY-2);ctx.restore()}
  if(hover&&hover.t==='room'){ctx.save();ctx.globalAlpha=.7;ctx.fillStyle=C.teal;ctx.fillRect(hover.r.x,fy0(hover.i)+92,hover.r.w,1);ctx.restore()}}
setProject(PROJECTS[0]);draw();requestAnimationFrame(step);
if(location.hash==='#ask')openEvent(0);if(location.hash==='#talk')openIntercom(0);if(location.hash==='#lib')openLibrary(0);if(location.hash==='#tab')openTab(0);if(location.hash==='#todo')setTimeout(()=>toggleTodo(0),50);if(location.hash==='#flow')openArt('refresh','flow');
</script>
