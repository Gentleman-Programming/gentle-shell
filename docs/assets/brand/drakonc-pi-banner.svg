  <title id="banner-title">DRAKONC-PI — Pi-native development environment</title>
  <desc id="banner-desc">A dark navy banner with a narrow monospaced DRAKONC-PI wordmark, the red Drakonc dragon inside a ring, and the promise of clear, human-directed development.</desc>
