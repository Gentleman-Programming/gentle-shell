    <linearGradient id="banner-rule" x1="0" x2="1"><stop stop-color="#ff4d5e" stop-opacity="0"/><stop offset=".18" stop-color="#ff4d5e"/><stop offset=".72" stop-color="#ff8993"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></linearGradient>
    <radialGradient id="banner-glow"><stop stop-color="#ff4d5e" stop-opacity=".28"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#banner-bg)"/>
