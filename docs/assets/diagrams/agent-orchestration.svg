<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="agents-title agents-desc">
  <title id="agents-title">Focused agent orchestration</title>
  <desc id="agents-desc">One responsible parent assigns focused mapping, implementation, and verification work. Observed results return through a shared lane outside the worker cards.</desc>
  <defs>
    <linearGradient id="agents-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0b12"/><stop offset="1" stop-color="#20101f"/></linearGradient>
    <marker id="agents-task-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#f095c8"/></marker>
    <marker id="agents-result-arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d7a0b8"/></marker>
  </defs>
  <rect width="960" height="700" rx="20" fill="url(#agents-bg)"/>
  <text x="58" y="65" fill="#fff7f1" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Focused agents.</text>
  <text x="58" y="120" fill="#d7a0b8" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">One responsible parent.</text>
  <rect x="270" y="178" width="420" height="132" rx="18" fill="#2a1426" stroke="#f095c8" stroke-width="3"/>
  <g fill="#18131b" stroke="#d7a0b8" stroke-width="2"><rect x="40" y="410" width="240" height="140" rx="16"/><rect x="360" y="410" width="240" height="140" rx="16"/><rect x="680" y="410" width="240" height="140" rx="16"/></g>
  <g fill="none" stroke="#f095c8" stroke-width="3" stroke-linecap="round" marker-end="url(#agents-task-arrow)"><path d="M340 310V350H160V410"/><path d="M480 310V410"/><path d="M620 310V350H800V410"/></g>
  <g fill="none" stroke="#d7a0b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"><path d="M160 550V580"/><path d="M480 550V580"/><path d="M800 550V580"/><path d="M160 580H800"/></g>
  <path d="M160 580H20V244H270" fill="none" stroke="#d7a0b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" marker-end="url(#agents-result-arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle"><text x="480" y="240" fill="#fff7f1" font-size="36" font-weight="700">Parent session</text><text x="480" y="282" fill="#d7a0b8" font-size="32">Coordinates</text><g fill="#fff7f1" font-size="36" font-weight="700"><text x="160" y="487">Map</text><text x="480" y="487">Implement</text><text x="800" y="487">Verify</text></g></g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"><path d="M58 642H126" stroke="#f095c8" stroke-width="4" stroke-linecap="round"/><text x="142" y="653" fill="#f095c8">Task</text><path d="M310 642H378" stroke="#d7a0b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 8"/><text x="394" y="653" fill="#d7a0b8">Result</text></g>
</svg>
