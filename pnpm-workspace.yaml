# Use hoisted node_modules so npm bundledDependencies can be packed for Pi package dependencies.
nodeLinker: hoisted

# Do not run an implicit `pnpm install` before `pnpm run`/`pnpm test`; run
# `pnpm install` yourself after the lockfile changes, in the checkout that owns
# node_modules (a worktree that links to it must unlink it first and install its
# own copy, or the install hits the same purge). pnpm 11 defaults this to
# "install", which in a worktree whose node_modules links to another checkout
# always reports stale state and then tries to purge that shared node_modules
# (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY without a TTY). Never work around
# it with CI=true or confirmModulesPurge: false: that deletes the linked copy.
verifyDepsBeforeRun: false

# Reject installs of packages published less than 3 days ago (4320 minutes).
# Supply-chain defense — most malicious packages are caught within a few days.
minimumReleaseAge: 4320

# Approved Pi 1.0.0 upgrade; frozen installs also verify release age.
# One-time exception to adopt 1.0.0 before the 72h maturity window. With the
# open-range devDependency policy (>=1.0.0), routine updates need no entry
# here: releases become eligible automatically once 72h old.
# Keep the exception version-specific, including Pi's required aligned packages.
minimumReleaseAgeExclude:
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'

# Refuse to install a package whose maintainer trust level has decreased
# (e.g. previously verified publisher loses verification).
trustPolicy: no-downgrade

# Block transitive dependencies from using git: or tarball sources.
blockExoticSubdeps: true

allowBuilds:
  '@google/genai': true
  esbuild: false
  koffi: true
  protobufjs: true
