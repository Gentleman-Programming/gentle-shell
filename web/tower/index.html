<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drakonc Tower</title>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="28" height="10" viewBox="0 0 28 10" aria-hidden="true"><g fill="#ff4d5e"><rect x="5" y="0" width="1" height="1"/><rect x="14" y="0" width="1" height="1"/><rect x="4" y="1" width="3" height="1"/><rect x="13" y="1" width="3" height="1"/><rect x="3" y="2" width="4" height="1"/><rect x="12" y="2" width="4" height="1"/><rect x="2" y="3" width="21" height="1"/><rect x="2" y="4" width="23" height="1"/><rect x="2" y="5" width="10" height="1"/><rect x="14" y="5" width="13" height="1"/><rect x="2" y="6" width="10" height="1"/><rect x="14" y="6" width="8" height="1"/><rect x="24" y="6" width="3" height="1"/><rect x="2" y="7" width="19" height="1"/><rect x="3" y="8" width="4" height="1"/><rect x="9" y="8" width="4" height="1"/><rect x="15" y="8" width="4" height="1"/><rect x="4" y="9" width="16" height="1"/></g></svg>Drakonc Tower</div>
  <nav class="projects px" id="projects" aria-label="Projects: one building each"></nav>
  <nav id="lobby" class="lobby" aria-label="The club"><button id="newfloor-btn" class="btn primary">+ New floor <kbd>N</kbd></button><button id="lib-btn" class="btn">Engram library</button><button id="tab-btn" class="btn">Your tab</button><button id="review-btn" class="btn" aria-pressed="false">Review: —</button></nav>
</header>
<main id="stage" class="stage" hidden>
  <div id="canvas" class="canvas"></div>
  <nav id="floors" class="floors" aria-label="Floors (sessions)"></nav>
  <section id="todo" class="todo px" aria-live="polite" aria-label="Floor tasks" hidden></section>
</main>
<section id="sel" class="sel px" aria-live="polite" hidden></section>
<aside id="intercom" class="intercom px" aria-label="Floor intercom" hidden></aside>
<div id="dim" class="dim" hidden></div>
<section id="empty" class="empty-state" hidden>
  <h1>No floors yet</h1>
  <p>Open Drakonc Shell in a project. Every session shows up here as a floor of that project's building.</p>
</section>
<div id="offline" class="offline px" role="status" hidden>Lost the connection to Drakonc Shell. Retrying…</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
